<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Chi Siamo - Il Mio Sito</title>
    <style>
        /* Reset e stili base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    line-height: 1.6;
    color: #333;
    background-color: #f4f4f4;
}

/* Navigazione */
header {
    background: #2c3e50;
    color: #fff;
    padding: 1rem 0;
    position: sticky;
    top: 0;
}

nav {
    display: flex;
    justify-content: center;
    gap: 20px;
}

nav a {
    color: #fff;
    text-decoration: none;
    font-weight: bold;
    transition: color 0.3s;
}

nav a:hover {
    color: #3498db;
}

/* Contenuto */
.container {
    max-width: 800px;
    margin: 2rem auto;
    background: #fff;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h1 {
    margin-bottom: 1rem;
    color: #2c3e50;
}

p {
    margin-bottom: 1rem;
}

/* Form */
.form-group {
    margin-bottom: 1rem;
}

label {
    display: block;
    margin-bottom: 0.5rem;
}

input, textarea {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    background: #3498db;
    color: white;
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
}

button:hover {
    background: #2980b9;
}

footer {
    text-align: center;
    padding: 2rem;
    font-size: 0.9rem;
    color: #777;
}
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/camion-store/home">Home</a>
            <a href="/camion-store/chi-siamo">Chi Siamo</a>
            <a href="/camion-store/cosa-facciamo">Cosa Facciamo</a>
            <a href="/camion-store/modulo-messaggio">Contattaci</a>
        </nav>
    </header>

    <div class="container">
        <h1>Chi Siamo</h1>
        <p>Siamo un team di appassionati che lavorano insieme per offrire le migliori soluzioni digitali.</p>
        <p>La nostra storia nasce dalla voglia di innovare e semplificare la vita degli utenti attraverso il web.</p>
    </div>

    <footer>&copy; 2024 Il Mio Progetto Web</footer>
</body>
</html>
